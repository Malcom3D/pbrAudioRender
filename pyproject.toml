[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pbrAudioRender"
dynamic = ["version"]
description = "Physically based rendered 3D acoustic render"
authors = [
    {name = "Malcom3D", email = "malcom3d.gpl@gmail.com"},
]
readme = "README.md"
license = {text = "GPLv3"}
keywords = ["template", "modular", "extensible"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
]

[project.urls]
Homepage = "https://pbraudio.org"
Repository = "https://github.com/Malcom3D/pbrAudioRender"

[tool.setuptools_scm]
write_to = "src/pbrAudioRender/_version.py"
